[tips-and-tricks-item-description]
nullius-geology-1=Du bist gerade auf einem kargen Planeten gelandet. Ein Teil deiner Ausrüstung wurde bei der Landung beschädigt. Du solltest in der Lage sein, aus den Trümmern ein Labor zu bergen.\n\nDieser Planet ist dir unbekannt. Um loszulegen, musst du zunächst die örtlichen Gegebenheiten analysieren. Stelle das [entity=nullius-lab-1] und das [entity=nullius-solar-panel-1], die du geborgen hast, auf und beginne mit der Erforschung von [technology=nullius-geology-1]. Diese erste Forschung erfordert keine Wissenschaftspakete, sondern lediglich ein mit Strom versorgtes Labor.
nullius-chlorine=Die Elektrolyse von [fluid=nullius-saline] oder [fluid=nullius-brine] erzeugt sowohl [fluid=nullius-chlorine] als auch [item=nullius-sodium-hydroxide]. Lagere Überschüsse, bis du sie verwenden oder verarbeiten kannst.\n\n[recipe=nullius-saline-caustic-solution] wandelt Natriumhydroxid in Natronlauge um. [recipe=nullius-dust-disposal-1] verbraucht Chlor. Auf Nauvis kann ein [entity=nullius-outfall-1] geeignete Flüssigkeiten entsorgen. Auf Fulgora ist die Flüssigkeitsentsorgung verboten: Nutze dort chemische Umwandlung und Rückgewinnung.

nullius-power=Auf Nauvis stammen deine ersten [item=nullius-solar-panel-1] und [item=nullius-grid-battery-1] aus dem Wrack. Forschung schaltet weitere Energiequellen und Speicher frei. Andere Planeten haben eigene Startausrüstung und Energiequellen.
nullius-priority=[item=nullius-electrolyzer-1], [item=nullius-compressor-1], [item=nullius-turbine-open-1] und [item=nullius-turbine-closed-1] haben verschiedene Energieprioritäten. Mit __CONTROL__nullius-prioritize__ wechselst du den Modus.\n\nPrioritätsverbraucher erhalten vor Überschussverbrauchern Strom. Bei unzureichender Versorgung können beide langsamer arbeiten. Überschussverbraucher nutzen die Energie, die nach der Versorgung der Prioritätsverbraucher übrig bleibt.\n\nAblasturbinen verarbeiten ihren gesamten verfügbaren Eingang, auch wenn das Netz ihre Leistung nicht benötigt. Standardturbinen richten sich nach dem Bedarf. Reserveturbinen laufen, wenn die Erzeuger mit höherer Priorität den Bedarf nicht decken.
nullius-hydrogen-battery=Mit überschüssigem Strom kannst Du [fluid=nullius-water] in einem [entity=nullius-surge-electrolyzer-1] spalten, um [fluid=nullius-hydrogen] und [fluid=nullius-oxygen] zu gewinnen. Diese können in einer [entity=nullius-combustion-chamber-1] kombiniert werden, um [fluid=nullius-steam] zu erzeugen. Dieser Dampf kann in eine [entity=nullius-turbine-open-backup-1] oder [entity=nullius-turbine-closed-backup-1] abgelassen werden, um in Zeiten geringer Stromerzeugung mehr Strom zu erzeugen.\n\nEin [item=nullius-electrolyzer-1] kann so konfiguriert werden, dass er nur bei überschüssiger Stromerzeugung läuft, indem man ihn mit __CONTROL__nullius-prioritize__ in den Spitzenlastmodus versetzt.\n\n[item=nullius-turbine-open-1] und [item=nullius-turbine-closed-1] können mithilfe von __CONTROL__nullius-prioritize__ im Standard-, Abgas- oder Backup-Modus konfiguriert werden. Turbinen im Standardmodus erzeugen Strom mit derselben Priorität wie andere Stromerzeugungsmethoden. Abgasturbinen laufen immer, wenn Gas zugeführt wird, wobei überschüssiger Strom, der nicht verbraucht wurde, verworfen wird. Notstromturbinen werden nur aktiviert, wenn Standard- und Abgasturbinen nicht genügend Strom erzeugen.
nullius-compressed-nitrogen-battery=Mit überschüssigem Strom kannst du [fluid=nullius-nitrogen] in einem [entity=nullius-surge-compressor-1] komprimieren. Wenn die Grundlaststromerzeugung unter den Bedarf fällt, kann der [fluid=nullius-compressed-nitrogen] über eine [entity=nullius-turbine-closed-backup-2] wieder freigegeben werden, wodurch der größte Teil der Energie zurückgewonnen wird, die ursprünglich zur Komprimierung des Gases aufgewendet wurde.\n\nDas Konzept ähnelt dem der [tip=nullius-hydrogen-battery], wobei die Energie im [fluid=nullius-compressed-nitrogen] statt in den getrennten Bestandteilen [fluid=nullius-hydrogen] und [fluid=nullius-oxygen] gespeichert wird.\n\nVerschiedene komprimierte Gase speichern unterschiedliche Energiemengen. Dies beeinflusst, wie viel Energie pro Einheit komprimierten Gases gespeichert wird und somit auch, wie viel Energie in einem Tank mit komprimiertem Gas gespeichert ist. [fluid=nullius-nitrogen] lässt sich leicht in großen Mengen beschaffen und ist meist ein Abfallprodukt, was es zu einer naheliegenden Option für die Energiespeicherung in Form von komprimiertem Gas macht. Es ist nicht das Gas mit der höchsten Energiedichte und im weiteren Verlaufe deiner Fabrik werden weitere komprimierte Gase verfügbar sein.
nullius-solar-thermal-power=[item=nullius-solar-collector-1] wandelt Sonnenlicht in Wärme um. Nutze diese Wärme zur Stromerzeugung. Gespeicherte Wärme kann nach Sonnenuntergang weiter Energie liefern.\n\nJeder aktive, bündig angrenzende Kollektor derselben Stufe erhöht die Wärmeleistung um 10 %. Eine Anordnung als Block erhöht die Leistung. Unterschiedliche Stufen geben einander keinen Bonus.
nullius-heat=[font=heading-1]Wärmeerzeugung[/font]\n\nEin [item=nullius-solar-collector-1] wandelt tagsüber Sonnenenergie in Wärme um. Ein [item=nullius-geothermal-plant-1] wird auf einer [entity=nullius-fumarole] errichtet und erzeugt eine konstante Wärmemenge, ohne das [fluid=nullius-volcanic-gas] zu verbrauchen. Ein [item=nullius-reactor] verbraucht Kernbrennstoffe und gibt Wärme ab.\n\n[font=heading-1]Wärmeverbrauch[/font]\n\nWärme kann auf zwei Arten genutzt werden: zur Erzeugung von [fluid=nullius-steam] in einem [item=nullius-heat-exchanger-1] oder zum Antrieb eines [item=nullius-stirling-engine-1], um direkt Strom zu erzeugen. Dampf kann in einer Turbine effizienter zur Stromerzeugung genutzt werden als mit einem Stirlingmotor, was jedoch mit einer höheren Komplexität einhergeht. Dampf aus einem Wärmetauscher kann auch zum Antrieb industrieller Prozesse genutzt werden, wie beispielsweise bei der energieeffizienteren [recipe=nullius-steam-electrolysis].\n\n[font=heading-1]Wärmespeicherung[/font]\n\nAlle Wärmeerzeuger und -verbraucher verfügen über eine gewisse thermische Masse, die als Wärmepuffer fungiert. Der [item=nullius-thermal-tank-1] bietet einen speziellen Wärmespeicher, der dazu beitragen kann, mehr Wärme aus Solarkollektoren über die Nacht hinweg zu erhalten.

nullius-plumbing=Deine Fabrik muss viele verschiedene Flüssigkeiten produzieren, ausgleichen und entleeren, um dein Ziel zu erreichen. Ein sorgfältiges Management dieser Flüssigkeiten ist für den reibungslosen Betrieb der Fabrik unerlässlich.
nullius-pipe-extents=Rohrleitungen haben eine begrenzte Länge. Verschiedene Rohrmaterialien weisen unterschiedliche maximale Rohrleitungslängen auf, wobei fortschrittlichere Rohrmaterialien eine größere maximale Länge ermöglichen. Eine Rohrleitung, die aus mehreren Rohrtypen besteht, hat die Länge des Rohrs mit der geringsten Reichweite.\n\nEine Rohrleitung, die ihre Grenze erreicht hat, kann durch Hinzufügen von Pumpen zur Förderung der Flüssigkeit verlängert werden. Ein bidirektionaler Durchfluss kann durch eine Kombination aus Nachfüll- und Überlaufpumpen hergestellt werden, die Flüssigkeiten in entgegengesetzte Richtungen befördern.\n\nMittlere und große Flüssigkeitstanks haben geringere Reichweiten als Rohre derselben Stufe, wobei große Tanks die geringste Reichweite aufweisen. Isoliere Tanks hinter Pumpen, um die maximale Rohrleitungsreichweite zu ermöglichen.
nullius-pump-modes=Mit __CONTROL__configurable-valves-switch__ wechselst du zwischen vier Pumpenmodi.\n\nNormale Pumpen fördern vom Eingang zum Ausgang. Überlaufpumpen laufen, wenn der Eingangsfüllstand über ihrem Grenzwert liegt. Nachfüllpumpen laufen, wenn der Ausgangsfüllstand unter ihrem Grenzwert liegt. Einwegpumpen laufen, wenn der Eingangsfüllstand höher als der Ausgangsfüllstand ist. Die Grenzwerte sind in der Pumpenoberfläche einstellbar.

nullius-terraforming=Du bist ein Terraforming-Androide, der von deinen Vorfahren entsandt wurde, um unfruchtbare Planeten in der Galaxie terraformen und Leben unter den Sternen zu verbreiten. Du bist auf diesem Planeten gelandet und musst nun eine Fabrik errichten, die in der Lage ist, die lokale Umgebung zu terraformen, Leben aus Rohstoffen zu erschaffen und die nächste Welle von Terraforming-Androiden auszusenden, um die Mission fortzusetzen.
nullius-oxygen-venting=Dieser Planet verfügt über keinen freien [fluid=nullius-oxygen] in der Atmosphäre. Eines deiner langfristigen Terraforming-Ziele besteht darin, den Sauerstoffgehalt in der Atmosphäre so weit zu erhöhen, dass Lebewesen überleben und später gedeihen können.\n\nDu kannst keinen Sauerstoff herstellen, sondern lediglich Sauerstoff gewinnen, der bereits in [fluid=nullius-water] und [fluid=nullius-carbon-dioxide] vorhanden ist, indem du diese Moleküle aufspaltest. Durch die Elektrolyse einer Einheit Wasser entstehen eine Einheit [fluid=nullius-oxygen] und zwei Einheiten [fluid=nullius-hydrogen]. Das Ablassen von Sauerstoff erhöht den Sauerstoffgehalt in der Atmosphäre, das Ablassen von Wasserstoff hingegen verringert ihn, da sich dieser mit dem Sauerstoff in der Atmosphäre zu Wasserdampf verbindet. Um den Sauerstoffgehalt in der Atmosphäre erfolgreich zu erhöhen, muss der Wasserstoff durch einen Prozess verbraucht werden, der verhindert, dass er in die Atmosphäre entweicht.\n\nDas Ablassen verschiedener Gase führt auf ähnliche Weise zu einer Verbindung mit dem Sauerstoff in der Atmosphäre und macht einen Teil der Fortschritte bei der Erreichung des angestrebten Sauerstoffgehalts zunichte. Verschiedene Gase verbinden sich in unterschiedlichen Verhältnissen mit Sauerstoff. Zwei Einheiten [fluid=nullius-hydrogen] verbinden sich mit einer Einheit [fluid=nullius-oxygen], sodass das Ablassen von Wasserstoff eine Sauerstoffreduktionsstrafe von 50 % nach sich zieht. Das Ablassen der folgenden Gase führt zu einer Sauerstoffreduktionsstrafe:\n\n[fluid=nullius-volcanic-gas]: 20 %\n[fluid=nullius-hydrogen]: 50 %\n[fluid=nullius-carbon-monoxide]: 50 %\n[fluid=nullius-deuterium]: 50 %\n[fluid=nullius-ammonia]: 100 %\n[fluid=nullius-methane]: 200 %
nullius-land-fill-dumping=Die Rezepte für die Deponierung [recipe=nullius-dumping-rock], [recipe=nullius-dumping-dirt] und [recipe=nullius-dumping-sand] ermöglichen die automatisierte Ablagerung großer Mengen an Nebenprodukten. Terraforming-Drohnen werden mit großen Mengen an Deponiematerial beladen und in abgelegene Gebiete des Planeten entsandt, um ihre Ladung dort abzuladen – weit entfernt von den empfindlichen Umgebungen, die für das Terraforming erforderlich sind. Alles, was zu Deponiematerial verarbeitet werden kann, lässt sich auf diese Weise entsorgen. Einige Drohnen überstehen die lange Reise und werden in ihre einzelnen Roboterteile zerlegt, um später wiederverwendet zu werden.\n\nZu den Nebenprodukten, die auf diese Weise entsorgt werden können, gehören [item=nullius-box-gravel], [item=nullius-box-sand], [item=nullius-box-mineral-dust], [item=nullius-box-graphite], [item=nullius-box-plastic], [item=nullius-box-acid-boric], [item=nullius-box-cellulose] und [fluid=nullius-chlorine]. Einige Nebenprodukte müssen vor der Entsorgung aufbereitet werden, beispielsweise durch Verfahren wie [recipe=nullius-plastic-pyrolysis] und anschließend [recipe=nullius-carbon-sink].

nullius-biology=Deine Fabrik ist nun in der Lage, die Bausteine des Lebens zu synthetisieren und aus diesen Grundbausteinen neue Organismen zu erschaffen, die in der lokalen Umgebung gedeihen können.
nullius-bootstrapping-biology=Du verfügst nun über die Technologie, um die grundlegenden Bausteine des Lebens zu synthetisieren: [fluid=nullius-amino-acids], [fluid=nullius-fatty-acids], [fluid=nullius-nucleotides] und [item=nullius-sugar]. Lebende Organismen verfügen über bemerkenswert effiziente Methoden, um die notwendigen biologischen Bestandteile zur Erhaltung ihres Lebens selbst zu erzeugen. Leider steht dir noch keine davon zur Verfügung.\n\nDie Synthese dieser Bausteine ist ein langsamer und energieintensiver Prozess. Umsichtigen Androiden wird empfohlen, unverzüglich eine kleine biochemische Fabrik einzurichten, um diese Bausteine in kleinen Mengen herzustellen. Mit der Zeit werden diese kleinen Mengen ausreichen, um sich selbst replizierende Lebensformen zu züchten, die dann auf effizientere Weise für die Gewinnung dieser biologischen Bausteine genutzt werden können.
nullius-creating-life=Leben repliziert sich selbst, sobald es etabliert ist, doch zunächst muss es erschaffen werden. Jede neue Lebensform, die für die Terraformung des Planeten notwendig ist, muss zunächst synthetisiert werden, bevor sie an ihrer eigenen Replikation mitwirken kann. Deine biologische Forschung hat einen Stamm von [fluid=nullius-bacteria] entwickelt, der in der lokalen Umgebung gedeihen wird. Mit Hilfe von [recipe=nullius-bacteria] kannst du eine Anfangspopulation von Bakterien synthetisieren und diese als Katalysator nutzen, um mit [recipe=nullius-bacteria-2] eine sich selbst replizierende Bakterienkolonie zu gründen.\n\nJede neue Lebensform, die du erschaffst, muss einem ähnlichen Ablauf folgen: Zunächst wird eine kleine Population synthetisiert, dann werden diese ersten Organismen genutzt, um die Selbstreplikation in Gang zu setzen.
