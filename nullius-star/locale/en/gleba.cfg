[technology-description]
nullius-bioreactor-1=Enable bioreactor modes for chemical plant 1, hydro plant 1 and flotation cell 1. Bioreactors burn nutrient goop for innate productivity and are these machines' Gleba mode.
nullius-hydrocarbon-protein=Grow nutrient goop for bioreactors from filtered hydrocarbons and ammonia.
nullius-bioreactor-engineering-2=Enable bioreactor modes for chemical plant 2, hydro plant 2 and flotation cell 2. Each machine also requires its ordinary construction recipe.
nullius-bioreactor-engineering-3=Enable bioreactor modes for chemical plant 3, hydro plant 3 and flotation cell 3. Each machine also requires its ordinary construction recipe.
nullius-nutrient-technology=Adapt machinery to burn nutrient goop on Gleba. Cultivate fuel, iron, silica and biochemistry packs from microbial mats and ferric rock, and grow goop elsewhere from methanol and ammonia.
nullius-wild-strain-cultivation=Domesticate wild cultures from Gleba. Compare strains to produce microbiology packs for the biology lab.

